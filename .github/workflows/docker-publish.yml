name: Publish Docker Images to Docker Hub

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.16.0). Leave empty to extract from acs-domain-checker.ps1'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    environment: default
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      linux-tag: ${{ steps.get-version.outputs.linux-tag }}
      artifact-sha: ${{ steps.verify-artifact.outputs.artifact-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manual version: $VERSION"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Using version from tag: $VERSION"
          else
            # Extract version from PowerShell script
            VERSION=$(grep -oP '\$script:AppVersion\s*=\s*["'"'"']\K\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.\-]+)?' acs-domain-checker.ps1 | head -1)
            echo "Extracted version from script: $VERSION"
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: Could not determine version"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "linux-tag=linux-$VERSION" >> $GITHUB_OUTPUT

      - name: Verify release artifact matches source
        id: verify-artifact
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          # acs-domain-checker.ps1 is GENERATED from src/ and is what ships inside the
          # image, so publishing without checking it can ship code that is not in src/.
          function Get-NormalizedSha([string]$Path) {
            # Compare newline-normalized text rather than raw bytes: the repo has no
            # .gitattributes, so a runner checkout could differ only in line endings.
            $text = [System.IO.File]::ReadAllText($Path) -replace "`r`n", "`n"
            $sha = [System.Security.Cryptography.SHA256]::Create()
            try {
              return (-join ($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($text)) | ForEach-Object { $_.ToString('x2') }))
            } finally { $sha.Dispose() }
          }

          $artifactPath = Join-Path $env:GITHUB_WORKSPACE 'acs-domain-checker.ps1'
          $rebuiltPath = Join-Path $env:RUNNER_TEMP 'acs-domain-checker.rebuilt.ps1'
          if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) { throw "Release artifact not found: $artifactPath" }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) { throw 'Resolved release version is empty.' }

          # -SkipUiAssetDownload keeps the gate off the network so a CDN hiccup cannot
          # fail a release for a reason unrelated to correctness.
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./Build-Release.ps1 -OutputPath $rebuiltPath -Force -SkipUiAssetDownload
          if ($LASTEXITCODE -ne 0) { throw "Artifact rebuild failed with exit code $LASTEXITCODE." }

          $failed = $false
          $committedSha = Get-NormalizedSha $artifactPath
          $rebuiltSha = Get-NormalizedSha $rebuiltPath

          if ($committedSha -cne $rebuiltSha) {
            Write-Output "::error file=acs-domain-checker.ps1::Committed acs-domain-checker.ps1 does not match a rebuild from src/. Run: pwsh -NoProfile -File ./Build-Release.ps1 -Force -SkipUiAssetDownload   then commit the regenerated artifact."
            Write-Output "committed=$committedSha"
            Write-Output "rebuilt  =$rebuiltSha"
            $failed = $true
          } elseif ((Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $rebuiltPath -Algorithm SHA256).Hash) {
            Write-Output "::warning file=acs-domain-checker.ps1::Artifact matches after newline normalization but differs in raw bytes (line-ending drift)."
          }

          $versionPattern = '(?m)^[ \t]*\$script:AppVersion[ \t]*=[ \t]*(?<q>[''"])(?<v>[^''"\r\n]+)\k<q>'
          $versionMatches = [regex]::Matches([System.IO.File]::ReadAllText($rebuiltPath), $versionPattern)
          if ($versionMatches.Count -ne 1) {
            Write-Output '::error file=src/03-MetricsHashKey.ps1::Expected exactly one literal $script:AppVersion assignment in the rebuilt artifact.'
            $failed = $true
          } else {
            $artifactVersion = $versionMatches[0].Groups['v'].Value
            # A tag may add a pre-release suffix (2.16.0-rc1), but its numeric core must
            # identify the code inside the image. A free-text override would reopen the
            # mislabeling hole this gate exists to close.
            $versionOk = ($env:RELEASE_VERSION -ceq $artifactVersion) -or $env:RELEASE_VERSION.StartsWith("$artifactVersion-", [System.StringComparison]::Ordinal)
            if (-not $versionOk) {
              Write-Output "::error file=src/03-MetricsHashKey.ps1::Release version '$($env:RELEASE_VERSION)' does not match the compiled artifact version '$artifactVersion'. Update src/03-MetricsHashKey.ps1 and rebuild, or correct the tag. A pre-release suffix such as '$artifactVersion-rc1' is allowed."
              $failed = $true
            }
          }

          if ($failed) { exit 1 }
          "artifact-sha=$committedSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "Release gate passed. Artifact matches src/ and version $artifactVersion is consistent."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Linux image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.linux
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORYNAME }}:${{ steps.get-version.outputs.linux-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-windows:
    runs-on: windows-2022
    environment: default
    needs: build-linux
    outputs:
      windows-tag: ${{ steps.get-version.outputs.windows-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version
        id: get-version
        shell: pwsh
        run: |
          $VERSION = "${{ needs.build-linux.outputs.version }}"
          Write-Output "Using version: $VERSION"
          Write-Output "version=$VERSION" >> $env:GITHUB_OUTPUT
          Write-Output "windows-tag=windows-$VERSION" >> $env:GITHUB_OUTPUT

      - name: Verify release artifact matches the gated build
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.build-linux.outputs.artifact-sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          # This job can be re-run on its own after the Linux job already succeeded,
          # which would otherwise push an unverified artifact.
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SHA)) { throw 'No verified artifact hash was published by the Linux job.' }
          $text = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'acs-domain-checker.ps1')) -replace "`r`n", "`n"
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $actual = (-join ($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($text)) | ForEach-Object { $_.ToString('x2') }))
          } finally { $sha.Dispose() }
          if ($actual -cne $env:EXPECTED_SHA) {
            throw "Windows job artifact ($actual) does not match the artifact verified by the Linux job ($($env:EXPECTED_SHA))."
          }
          Write-Output 'Artifact matches the gated build.'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Windows image
        shell: pwsh
        run: |
          $VERSION = "${{ needs.build-linux.outputs.version }}"
          $WINDOWS_TAG = "windows-$VERSION"
          $REPO = "${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORYNAME }}"

          Write-Output "Building Windows image: ${REPO}:${WINDOWS_TAG}"

          # Build Windows image
          docker build `
            -f Dockerfile.windows `
            --build-arg WINDOWS_BASE_TAG=nanoserver-ltsc2022 `
            -t "${REPO}:${WINDOWS_TAG}" `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed with exit code $LASTEXITCODE"
          }

          # Push Windows image
          Write-Output "Pushing Windows image: ${REPO}:${WINDOWS_TAG}"
          docker push "${REPO}:${WINDOWS_TAG}"

          if ($LASTEXITCODE -ne 0) {
            throw "Docker push failed with exit code $LASTEXITCODE"
          }

  create-multiarch-tags:
    runs-on: ubuntu-latest
    environment: default
    needs: [build-linux, build-windows]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch version tag
        run: |
          VERSION="${{ needs.build-linux.outputs.version }}"
          REPO="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORYNAME }}"
          LINUX_TAG="${{ needs.build-linux.outputs.linux-tag }}"
          WINDOWS_TAG="${{ needs.build-windows.outputs.windows-tag }}"

          echo "Creating multi-arch tag: ${REPO}:${VERSION}"
          docker buildx imagetools create \
            -t "${REPO}:${VERSION}" \
            "${REPO}:${LINUX_TAG}" \
            "${REPO}:${WINDOWS_TAG}"

      - name: Create/update latest tag
        run: |
          REPO="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORYNAME }}"
          LINUX_TAG="${{ needs.build-linux.outputs.linux-tag }}"
          WINDOWS_TAG="${{ needs.build-windows.outputs.windows-tag }}"

          echo "Creating/updating multi-arch tag: ${REPO}:latest"
          docker buildx imagetools create \
            -t "${REPO}:latest" \
            "${REPO}:${LINUX_TAG}" \
            "${REPO}:${WINDOWS_TAG}"

      - name: Verify multi-arch tags
        run: |
          VERSION="${{ needs.build-linux.outputs.version }}"
          REPO="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORYNAME }}"

          echo "Verifying ${REPO}:${VERSION}"
          docker buildx imagetools inspect "${REPO}:${VERSION}"

          echo "Verifying ${REPO}:latest"
          docker buildx imagetools inspect "${REPO}:latest"

      - name: Summary
        run: |
          VERSION="${{ needs.build-linux.outputs.version }}"
          REPO="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORYNAME }}"

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 Docker Images Published Successfully

          ### Version: \`$VERSION\`

          **Published Tags:**
          - \`${REPO}:${{ needs.build-linux.outputs.linux-tag }}\` (linux/amd64)
          - \`${REPO}:${{ needs.build-windows.outputs.windows-tag }}\` (windows/amd64)
          - \`${REPO}:${VERSION}\` (multi-arch)
          - \`${REPO}:latest\` (multi-arch)

          **Pull commands:**
          \`\`\`bash
          docker pull ${REPO}:${VERSION}
          docker pull ${REPO}:latest
          \`\`\`

          **View on Docker Hub:** https://hub.docker.com/repository/docker/${REPO}/tags/${VERSION}
          EOF
